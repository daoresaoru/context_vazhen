  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #cccccc; min-height: 100vh; }
    nav { background: #0f0f1a; padding: 14px 32px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid #333355; }
    nav .logo { font-size: 18px; font-weight: bold; color: #aaaaff; text-decoration: none; }
    nav a { color: #888899; text-decoration: none; font-size: 14px; }
    nav a:hover { color: #ccccff; }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
    .current-user { font-size: 13px; color: #aaaaff; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 22px; color: #ccccff; margin-bottom: 4px; }
    .card { background: #252540; border: 1px solid #333355; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .btn { display: inline-block; padding: 8px 16px; border-radius: 5px; font-size: 13px; cursor: pointer; text-decoration: none; border: none; }
    .btn-primary   { background: #334466; color: #aaccff; }

    .tag-badge { background:#2a2a44; color:#8888cc; font-size:9px; border-radius:2px; padding:0 3px; }
  </style>
</head>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const SUPABASE_URL = 'https://miyytqwqfjrtkbwqyiuy.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1peXl0cXdxZmpydGtid3F5aXV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NTcxNzAsImV4cCI6MjEwMzUzMzE3MH0.zhCMyP5wDrt_5mTM8qYNyj0GyOVqPbEOvXd7Hckym6o'

// ── Constants ──
const MAX_LINE_PX = 355
const TAG_RE = /<[^>]+>/g
const CHARACTER_TAGS = {
  '<E041 1 0>':'Рюноскэ','<E041 3 2>':'Сусато','<E041 4 4>':'Айрис',
  '<E041 2 1>':'Шерлок','<E041 17 1>':'Шерлок','<E041 78 56>':'Вагахаи',
  '<E041 96 59>':'Виндибанк','<E041 47 31>':'МакНат','<E041 10 6>':'Джина',
  '<E041 94 70>':'???','<E041 95 57>':'Том Летт','<E041 5 6>':'Джина',
  '<E041 7 9>':'Грегсон','<E041 77 55>':'Бобби','<E041 14 13>':'Стронгхарт',
  '<E041 75 24>':'Пристав','<E041 15 15>':'Судья','<E041 16 8>':'ван Зикс',
  '<E041 6 7>':'ван Зикс','<E041 97 60>':'Нэш (высокий)','<E041 94 58>':'Грейдон',
}
const STATUS_BASE_LABELS = {
  untranslated: 'Не переведено',
  translated:   'Переведено',
  edited:       'Отредактировано',
  approved:     'Одобрено',
}
const STATUS_ICONS = { untranslated:'⬜', translated:'🟩', edited:'🟦', approved:'🟪' }
const COLOR_TAGS  = { '<E006>':'red','<E007>':'blue','<E008>':'green','<E009>':'yellow' }
const COLOR_CLOSE = '<E005>'
const BADGE_TAGS  = { '<E025':'spd','<E085':'wait','<E330':'shk','<E333':'shk','<E334':'shk','<E341':'anim','<E169':'lip','<E145':'exp','<E603':'sfx','<E092':'cam' }

function cleanText(s) { return s.replace(TAG_RE,' ').replace(/\s+/g,' ').trim() }
function extractCharacter(s) { for (const [t,n] of Object.entries(CHARACTER_TAGS)) if (s.includes(t)) return n; return '' }

// Parse "translated:Phoenix Wright" → { base: "translated", user: "Phoenix Wright" }
function parseStatus(status) {
  const idx = status.indexOf(':')
  if (idx === -1) return { base: status, user: null }
  return { base: status.slice(0, idx), user: status.slice(idx + 1) }
}

function makeStatusString(base, user) {
  return user ? `${base}:${user}` : base
}

function statusLabel(status) {
  const { base, user } = parseStatus(status)
  const icon  = STATUS_ICONS[base]  || '⬜'
  const label = STATUS_BASE_LABELS[base] || base
  return user ? `${icon} ${label} — ${user}` : `${icon} ${label}`
}

// ── User ──
let currentUser = sessionStorage.getItem('tgaa_user') || null

  sessionStorage.setItem('tgaa_user', name)

}

}

// ── Chunk parsing ──
function parseChunks(segment) {
  const parts = segment.split(/(<[^>]+>)/)
  const chunks = []
  let prefixTags = '', currentText = ''
  function flush(closingTag) {
    const text = currentText.trim()
    if (text) chunks.push({ prefixTags, text, pauseTag: closingTag })
    prefixTags = ''; currentText = ''
  }
  for (const token of parts) {
    if (!token) continue
    if (/^<[^>]+>$/.test(token)) {
      if (currentText.trim()) { flush(token); prefixTags = token }
      else prefixTags += token
    } else { currentText += token }
  }
  flush('')
  return chunks
}

function renderOrigHTML(prefixTags, text) {
  let activeColor = null
  for (const tag of (prefixTags.match(/<[^>]+>/g)||[])) {
    if (COLOR_TAGS[tag]) activeColor = COLOR_TAGS[tag]
    else if (tag === COLOR_CLOSE) activeColor = null
  }
  let html = activeColor ? `<span class="c-${activeColor}">` : ''
  for (const token of text.split(/(<[^>]+>)/)) {
    if (!token) continue
    if (/^<[^>]+>$/.test(token)) {
      if (COLOR_TAGS[token]) {
        if (activeColor) html += '</span>'
        activeColor = COLOR_TAGS[token]
        html += `<span class="c-${activeColor}">`
      } else if (token === COLOR_CLOSE) {
        if (activeColor) html += '</span>'
        activeColor = null
      } else {
        for (const [pfx,lbl] of Object.entries(BADGE_TAGS))
          if (token.startsWith(pfx)) { html += `<span class="tag-badge">[${lbl}]</span>`; break }
      }
    } else {
      html += token.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')
    }
  }
  if (activeColor) html += '</span>'
  return html
}

// ── Line length ──
const _canvas = document.createElement('canvas')
const _ctx    = _canvas.getContext('2d')
_ctx.font     = '16px "Palatino Linotype","Book Antiqua",Palatino,serif'
function lineWidth(text) { return _ctx.measureText(text.replace(TAG_RE,'')).width }
function lineLengthLevel(text) {
  if (!text.trim()) return { level:'', px:0 }
  const maxPx = Math.max(...text.split('\n').map(l => lineWidth(l)))
  if (maxPx > MAX_LINE_PX)      return { level:'error', px: Math.round(maxPx) }
  if (maxPx > MAX_LINE_PX - 30) return { level:'warn',  px: Math.round(maxPx) }
  return { level:'ok', px: Math.round(maxPx) }
}

function wrapToLines(text) {
  if (!text) return ''
  const lines = []
  for (const para of text.split('\n')) {
    if (!para) { lines.push(''); continue }
    const words = para.split(' ')
    let current = ''
    for (const word of words) {
      const candidate = current ? current + ' ' + word : word
      if (lineWidth(candidate) <= MAX_LINE_PX) { current = candidate }
      else { if (current) lines.push(current); current = word }
    }
    if (current) lines.push(current)
  }
  return lines.map((l,i) => i >= 2 ? '⛔ ' + l : l).join('\n')
}

// ── State ──
const params = new URLSearchParams(location.search)
const fileId = parseInt(params.get('id'))
let fileData = null, segments = [], currentFilter = 'all'
const saveTimers = {}

// ── Load ──
async function load() {
  const { data: f } = await db.from('files').select('*').eq('id', fileId).single()
  fileData = f
  document.getElementById('fileName').textContent = f.name
  document.getElementById('fileDesc').textContent  = f.description || ''
  document.getElementById('fileDate').textContent  = 'Загружен: ' + f.uploaded_at.slice(0,10)
  document.title = 'TGAA — ' + f.name

  let allSegs = [], from = 0
  while (true) {
    const { data } = await db.from('segments').select('*').eq('file_id', fileId).order('seg_index').range(from, from+999)
    if (!data || !data.length) break
    allSegs = allSegs.concat(data)
    if (data.length < 1000) break
    from += 1000
  }
  segments = allSegs
  document.getElementById('spinner').style.display = 'none'
  updateStats()
  renderAll()
}

function updateStats() {
  const c = { untranslated:0, translated:0, edited:0, approved:0 }
  for (const s of segments) {
    const base = parseStatus(s.status).base
    c[base] = (c[base]||0) + 1
  }
  const total = segments.length, done = total - c.untranslated
  const pct = total ? Math.round(done/total*100) : 0
  document.getElementById('progressBar').style.width = pct+'%'
  document.getElementById('pctText').textContent = pct + '% переведено'
  document.getElementById('statTotal').textContent = total
  document.getElementById('statUnt').textContent = c.untranslated
  document.getElementById('statTr').textContent  = c.translated
  document.getElementById('statEd').textContent  = c.edited
  document.getElementById('statAp').textContent  = c.approved
}

function renderAll() {
  const list = document.getElementById('segList')
  list.innerHTML = ''
  segments.forEach((seg, i) => list.appendChild(makeSegRow(seg, i)))
}

function makeSegRow(seg, i) {
  const chunks = parseChunks(seg.raw_segment)
  const translations = Array.isArray(seg.translations) ? [...seg.translations] : []
  const character = extractCharacter(seg.raw_segment)
  const origPreview = cleanText(seg.raw_segment)
  const transPreview = translations.map(t => t.replace(TAG_RE,'')).filter(Boolean).join(' ')
  const { base: baseStatus } = parseStatus(seg.status)

  const wrapper = document.createElement('div')
  wrapper.className = 'seg-row'
  wrapper.dataset.baseStatus = baseStatus
  wrapper.dataset.id = seg.id
  wrapper.style.display = (currentFilter === 'all' || baseStatus === currentFilter) ? '' : 'none'

  // Header
  const header = document.createElement('div')
  header.className = 'seg-header'
  header.innerHTML = `
    <span class="seg-num">${i+1}</span>
    <span class="seg-char">${character}</span>
    <span class="seg-preview">${transPreview || origPreview}</span>
    <span class="seg-status-badge" title="${statusLabel(seg.status)}">${statusLabel(seg.status)}</span>
    <span class="seg-chevron">▶</span>`

  // Editor
  const editor = document.createElement('div')
  editor.className = 'seg-editor'

  // Column headers
  const colHdrs = document.createElement('div')
  colHdrs.className = 'col-headers'
  colHdrs.innerHTML = '<span class="col-header-lbl">Оригинал (EN)</span><span class="col-header-lbl">Перевод (RU)</span>'
  editor.appendChild(colHdrs)

  // Chunk pairs
  const chunkPairsDiv = document.createElement('div')
  chunks.forEach((chunk, ci) => {
    const pair = document.createElement('div')
    pair.className = 'chunk-pair'

    const origWrap = document.createElement('div')
    const origBox  = document.createElement('div')
    origBox.className = 'orig-box'
    origBox.innerHTML = renderOrigHTML(chunk.prefixTags, chunk.text)
    const pauseLbl = document.createElement('div')
    pauseLbl.className = 'chunk-label'
    pauseLbl.textContent = chunk.pauseTag || '↵ конец'
    origWrap.appendChild(origBox)
    origWrap.appendChild(pauseLbl)

    const transWrap = document.createElement('div')
    const lenDiv    = document.createElement('div')
    lenDiv.className = 'len-indicator'
    const transBox  = document.createElement('textarea')
    transBox.className = 'trans-box'
    transBox.rows = 2
    transBox.value = translations[ci] || ''
    transBox.placeholder = 'Перевод...'

    function updateLen() {
      const { level, px } = lineLengthLevel(transBox.value)
      transBox.className = 'trans-box' + (level==='error'?' error':level==='warn'?' warn':'')
      lenDiv.textContent = px ? `${px}/${MAX_LINE_PX}px` : ''
      lenDiv.style.color = level==='error'?'#ff5555':level==='warn'?'#aaaa44':'#44aa44'
    }
    updateLen()

    transBox.addEventListener('input', () => {
      translations[ci] = transBox.value
      updateLen()
      scheduleAutosave(seg, translations, wrapper, header, prevBox)
    })

    transWrap.appendChild(transBox)
    transWrap.appendChild(lenDiv)
    pair.appendChild(origWrap)
    pair.appendChild(transWrap)
    chunkPairsDiv.appendChild(pair)
  })
  editor.appendChild(chunkPairsDiv)

  // Page preview
  const prevLabel = document.createElement('div')
  prevLabel.className = 'page-preview-label'
  prevLabel.textContent = '📄 Страница целиком:'
  const prevBox = document.createElement('div')
  prevBox.className = 'page-preview-box'
  prevBox.dataset.previewFor = seg.id
  editor.appendChild(prevLabel)
  editor.appendChild(prevBox)

  // Footer
  const footer = document.createElement('div')
  footer.className = 'editor-footer'
  const statusSelect = document.createElement('select')
  statusSelect.className = 'status-select'
  for (const [k,v] of Object.entries(STATUS_BASE_LABELS)) {
    const opt = document.createElement('option')
    opt.value = k; opt.textContent = `${STATUS_ICONS[k]} ${v}`
    if (parseStatus(seg.status).base === k) opt.selected = true
    statusSelect.appendChild(opt)
  }
  statusSelect.addEventListener('change', async () => {
    const newBase = statusSelect.value
    const newStatus = makeStatusString(newBase, currentUser)
    seg.status = newStatus
    wrapper.dataset.baseStatus = newBase
    header.querySelector('.seg-status-badge').textContent = statusLabel(newStatus)
    header.querySelector('.seg-status-badge').title = statusLabel(newStatus)
    await db.from('segments').update({ status: newStatus }).eq('id', seg.id)
    updateStats()
    if (currentFilter !== 'all' && newBase !== currentFilter)
      wrapper.style.display = 'none'
  })

  const saveInd = document.createElement('span')
  saveInd.className = 'save-indicator'
  saveInd.dataset.saveFor = seg.id
  footer.appendChild(statusSelect)
  footer.appendChild(saveInd)
  editor.appendChild(footer)

  // Toggle
  let open = false
  header.addEventListener('click', () => {
    open = !open
    editor.classList.toggle('open', open)
    header.querySelector('.seg-chevron').textContent = open ? '▼' : '▶'
  })

  wrapper.appendChild(header)
  wrapper.appendChild(editor)
  return wrapper
}

function scheduleAutosave(seg, translations, wrapper, header, prevBox) {
  const ind = document.querySelector(`[data-save-for="${seg.id}"]`)
  if (ind) { ind.className = 'save-indicator saving'; ind.textContent = 'Сохранение...' }
  clearTimeout(saveTimers[seg.id])
  saveTimers[seg.id] = setTimeout(async () => {
    const hasTranslation = translations.some(t => t.trim())
    const { base: currentBase } = parseStatus(seg.status)

    if (hasTranslation && currentBase === 'untranslated') {
      const newStatus = makeStatusString('translated', currentUser)
      seg.status = newStatus
      wrapper.dataset.baseStatus = 'translated'
      header.querySelector('.seg-status-badge').textContent = statusLabel(newStatus)
      header.querySelector('.seg-status-badge').title = statusLabel(newStatus)
      const sel = wrapper.querySelector('.status-select')
      if (sel) sel.value = 'translated'
    }

    // Update header preview
    const preview = translations.map(t => t.replace(TAG_RE,'')).filter(Boolean).join(' ')
    const previewEl = header.querySelector('.seg-preview')
    if (previewEl) previewEl.textContent = preview || cleanText(seg.raw_segment)

    // Update page preview box
    if (prevBox) prevBox.textContent = wrapToLines(preview)

    const { error } = await db.from('segments')
      .update({ translations, status: seg.status })
      .eq('id', seg.id)

    if (ind) {
      ind.className = error ? 'save-indicator error' : 'save-indicator saved'
      ind.textContent = error ? 'Ошибка сохранения' : '✓ Сохранено'
      setTimeout(() => { if (ind) { ind.textContent=''; ind.className='save-indicator' } }, 2000)
    }
    seg.translations = [...translations]
    updateStats()
  }, 1000)
}

// Filter
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    currentFilter = btn.dataset.filter
    document.querySelectorAll('.seg-row').forEach(row => {
      row.style.display = (currentFilter==='all' || row.dataset.baseStatus===currentFilter) ? '' : 'none'
    })
  })
})

// Download
window.downloadFile = async () => {
  const { data: segs } = await db.from('segments').select('*').eq('file_id', fileId).order('seg_index')
  const data = { raw_script: fileData.raw_script, segments: segs.map(s => ({ raw_segment: s.raw_segment, translations: s.translations, status: s.status })) }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = fileData.name.replace('.txt','').replace('.myformat','') + '.json'
  a.click()
}

// Init
loadNamePicker()
if (currentUser) {
  document.getElementById('navUser').textContent = '👤 ' + currentUser
  document.getElementById('nameModal').classList.remove('open')
}
load()
</script>
