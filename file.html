<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TGAA — Файл</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #cccccc; min-height: 100vh; }
    nav {
      background: #0f0f1a; padding: 14px 32px;
      display: flex; align-items: center; gap: 24px;
      border-bottom: 1px solid #333355;
    }
    nav .logo { font-size: 18px; font-weight: bold; color: #aaaaff; text-decoration: none; }
    nav a { color: #888899; text-decoration: none; font-size: 14px; }
    nav a:hover { color: #ccccff; }
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 22px; color: #ccccff; margin-bottom: 4px; }
    .card { background: #252540; border: 1px solid #333355; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .btn {
      display: inline-block; padding: 8px 16px; border-radius: 5px;
      font-size: 13px; cursor: pointer; text-decoration: none; border: none;
    }
    .btn-primary   { background: #334466; color: #aaccff; }
    .btn-success   { background: #224422; color: #aaffaa; }
    .btn-secondary { background: #333344; color: #aaaacc; }
    .btn:hover { filter: brightness(1.2); }
    .progress-bar-outer { background: #1a1a2e; border-radius: 6px; height: 10px; overflow: hidden; margin: 6px 0; }
    .progress-bar-inner { height: 100%; background: #558855; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 12px; background: #1a1a2e; color: #8888aa; border-bottom: 1px solid #333355; position: sticky; top: 0; }
    td { padding: 10px 12px; border-bottom: 1px solid #222233; vertical-align: top; }
    tr.seg-row:hover td { background: #1e1e35; }
    .text-muted { color: #666688; font-size: 12px; }
    .flex { display: flex; align-items: center; gap: 12px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .status-select {
      background: #1a1a2e; color: #cccccc; border: 1px solid #444466;
      border-radius: 4px; padding: 4px 8px; font-size: 12px; width: 100%; cursor: pointer;
    }
    .filter-btn { font-size: 12px; padding: 4px 12px; }
    .filter-btn.active { background: #334466; color: #aaccff; }
    .spinner { text-align: center; padding: 48px; color: #666688; }
    .mono { font-family: 'Consolas', monospace; white-space: pre-wrap; }

    /* Status row tints */
    tr[data-status="translated"]   td { background: #1a2a1a; }
    tr[data-status="edited"]       td { background: #1a1a2a; }
    tr[data-status="approved"]     td { background: #1e1a2a; }
    tr[data-status="translated"]:hover td { background: #1e301e; }
    tr[data-status="edited"]:hover     td { background: #1e1e30; }
    tr[data-status="approved"]:hover   td { background: #241e30; }
  </style>
</head>
<body>
<nav>
  <a class="logo" href="index.html">⚖️ TGAA Translation Hub</a>
  <a href="index.html">← Все файлы</a>
</nav>

<div class="container">
  <div class="flex-between" style="margin-bottom: 20px;">
    <div>
      <h1 id="fileName">Загрузка...</h1>
      <p class="text-muted" id="fileDate"></p>
    </div>
    <div class="flex">
      <button class="btn btn-success" onclick="downloadFile()">⬇ Скачать .myformat</button>
      <a href="/upload" class="btn btn-primary" onclick="sessionStorage.setItem('uploadRedirect', location.href); return true;">⬆ Обновить</a>
    </div>
  </div>

  <!-- Stats -->
  <div class="card" style="margin-bottom: 20px;" id="statsCard">
    <div class="flex-between" style="margin-bottom: 8px;">
      <span style="color:#aaaadd;">Прогресс файла</span>
      <span id="pctText" style="color:#aaffaa;">—</span>
    </div>
    <div class="progress-bar-outer" style="height:12px;margin-bottom:12px;">
      <div class="progress-bar-inner" id="progressBar" style="width:0%"></div>
    </div>
    <div class="flex" style="gap:24px;flex-wrap:wrap;">
      <span class="text-muted">Всего: <strong id="statTotal" style="color:#ccc">—</strong></span>
      <span style="color:#888888;">⬜ <strong id="statUntranslated">—</strong></span>
      <span style="color:#558855;">🟩 <strong id="statTranslated">—</strong></span>
      <span style="color:#555588;">🟦 <strong id="statEdited">—</strong></span>
      <span style="color:#885588;">🟪 <strong id="statApproved">—</strong></span>
    </div>
  </div>

  <!-- Filter -->
  <div class="flex" style="margin-bottom:16px;flex-wrap:wrap;gap:8px;">
    <span style="color:#888899;font-size:13px;">Фильтр:</span>
    <button class="btn btn-secondary filter-btn active" data-filter="all">Все</button>
    <button class="btn btn-secondary filter-btn" data-filter="untranslated">⬜ Не переведено</button>
    <button class="btn btn-secondary filter-btn" data-filter="translated">🟩 Переведено</button>
    <button class="btn btn-secondary filter-btn" data-filter="edited">🟦 Отредактировано</button>
    <button class="btn btn-secondary filter-btn" data-filter="approved">🟪 Одобрено</button>
  </div>

  <!-- Table -->
  <div id="spinner" class="spinner">Загрузка сегментов...</div>
  <div id="tableWrap" style="display:none;">
    <div class="card" style="padding:0;overflow:hidden;">
      <table>
        <thead>
          <tr>
            <th style="width:40px;">#</th>
            <th style="width:110px;">Персонаж</th>
            <th>Оригинал (EN)</th>
            <th>Перевод (RU)</th>
            <th style="width:185px;">Статус</th>
          </tr>
        </thead>
        <tbody id="segBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const SUPABASE_URL = 'https://miyytqwqfjrtkbwqyiuy.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1peXl0cXdxZmpydGtid3F5aXV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NTcxNzAsImV4cCI6MjEwMzUzMzE3MH0.zhCMyP5wDrt_5mTM8qYNyj0GyOVqPbEOvXd7Hckym6o'
const db = createClient(SUPABASE_URL, SUPABASE_KEY)

const TAG_RE = /<[^>]+>/g
const CHARACTER_TAGS = {
  '<E041 1 0>':'Рюноскэ','<E041 3 2>':'Сусато','<E041 4 4>':'Айрис',
  '<E041 2 1>':'Шерлок','<E041 17 1>':'Шерлок','<E041 78 56>':'Вагахаи',
  '<E041 96 59>':'Виндибанк','<E041 47 31>':'МакНат','<E041 10 6>':'Джина',
  '<E041 94 70>':'???','<E041 95 57>':'Том Летт','<E041 5 6>':'Джина',
  '<E041 7 9>':'Грегсон','<E041 77 55>':'Бобби','<E041 14 13>':'Стронгхарт',
  '<E041 75 24>':'Пристав','<E041 15 15>':'Судья','<E041 16 8>':'ван Зикс',
  '<E041 6 7>':'ван Зикс','<E041 97 60>':'Нэш (высокий)','<E041 94 58>':'Грейдон',
}
const STATUS_LABELS = {
  untranslated: '⬜ Не переведено',
  translated:   '🟩 Переведено',
  edited:       '🟦 Отредактировано',
  approved:     '🟪 Одобрено',
}

function cleanText(seg) { return seg.replace(TAG_RE,' ').replace(/\s+/g,' ').trim() }
function extractCharacter(seg) {
  for (const [tag,name] of Object.entries(CHARACTER_TAGS))
    if (seg.includes(tag)) return name
  return ''
}

const params  = new URLSearchParams(location.search)
const fileId  = parseInt(params.get('id'))
let fileData  = null
let segments  = []
let currentFilter = 'all'

async function load() {
  const { data: f } = await db.from('files').select('*').eq('id', fileId).single()
  fileData = f
  document.getElementById('fileName').textContent = f.name
  document.getElementById('fileDate').textContent = 'Загружен: ' + f.uploaded_at.slice(0,10)
  document.title = 'TGAA — ' + f.name

  // Load segments in pages to handle large files
  let allSegs = [], from = 0
  while (true) {
    const { data } = await db.from('segments')
      .select('*').eq('file_id', fileId).order('seg_index')
      .range(from, from + 999)
    if (!data || data.length === 0) break
    allSegs = allSegs.concat(data)
    if (data.length < 1000) break
    from += 1000
  }
  segments = allSegs

  updateStats()
  renderTable()
  document.getElementById('spinner').style.display = 'none'
  document.getElementById('tableWrap').style.display = 'block'
}

function updateStats() {
  const counts = { untranslated:0, translated:0, edited:0, approved:0 }
  for (const s of segments) counts[s.status] = (counts[s.status]||0) + 1
  const total = segments.length
  const done  = total - counts.untranslated
  const pct   = total ? Math.round(done/total*100) : 0
  document.getElementById('progressBar').style.width = pct + '%'
  document.getElementById('pctText').textContent = pct + '% переведено'
  document.getElementById('statTotal').textContent        = total
  document.getElementById('statUntranslated').textContent = counts.untranslated
  document.getElementById('statTranslated').textContent   = counts.translated
  document.getElementById('statEdited').textContent       = counts.edited
  document.getElementById('statApproved').textContent     = counts.approved
}

function renderTable() {
  const tbody = document.getElementById('segBody')
  tbody.innerHTML = ''
  segments.forEach((seg, i) => {
    const translations = Array.isArray(seg.translations) ? seg.translations : []
    const combined = translations.map(t => t.replace(TAG_RE,'').trim()).filter(Boolean).join(' ')
    const character = extractCharacter(seg.raw_segment)
    const original  = cleanText(seg.raw_segment)

    const tr = document.createElement('tr')
    tr.className = 'seg-row'
    tr.dataset.status = seg.status
    tr.dataset.id = seg.id
    tr.style.display = (currentFilter === 'all' || seg.status === currentFilter) ? '' : 'none'

    const options = Object.entries(STATUS_LABELS)
      .map(([k,v]) => `<option value="${k}" ${seg.status===k?'selected':''}>${v}</option>`).join('')

    tr.innerHTML = `
      <td class="text-muted">${i+1}</td>
      <td style="color:#aaaaff;font-weight:bold;font-size:12px;">${character}</td>
      <td class="mono" style="color:#bbbbbb;font-size:12px;">${original}</td>
      <td class="mono" style="color:#ddddcc;font-size:12px;">${combined || '<span class="text-muted">—</span>'}</td>
      <td><select class="status-select" data-id="${seg.id}">${options}</select></td>`
    tbody.appendChild(tr)

    tr.querySelector('.status-select').addEventListener('change', async e => {
      const newStatus = e.target.value
      await db.from('segments').update({ status: newStatus }).eq('id', seg.id)
      seg.status = newStatus
      tr.dataset.status = newStatus
      tr.style.display = (currentFilter === 'all' || newStatus === currentFilter) ? '' : 'none'
      updateStats()
    })
  })
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    currentFilter = btn.dataset.filter
    document.querySelectorAll('.seg-row').forEach(tr => {
      tr.style.display = (currentFilter === 'all' || tr.dataset.status === currentFilter) ? '' : 'none'
    })
  })
})

// Download
window.downloadFile = async () => {
  const { data: segs } = await db.from('segments').select('*').eq('file_id', fileId).order('seg_index')
  const data = {
    raw_script: fileData.raw_script,
    segments: segs.map(s => ({ raw_segment: s.raw_segment, translations: s.translations, status: s.status }))
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = fileData.name.replace('.txt','') + '.myformat'
  a.click()
}

load()
</script>
</body>
</html>
